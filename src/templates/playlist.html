<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MySchoolMusic</title>
    <link rel="stylesheet" href="../static/stylesheet.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
<div class="container">
    <nav class="sidebar">
        <div class="logo">MySchoolMusic</div>
        <ul>
            <a href="index.html"><li class="active"><span class="material-symbols-rounded">home</span> Home</li></a>
            <li><span class="material-symbols-rounded">search</span> Search</li>
            <a href="playlist.html"><li><span class="material-symbols-rounded">library_music</span> Your Playlists</li></a>
        </ul>
    </nav>

    <main class="content">
        <header>
            <h1>Recommended for You</h1>
            <hr>
        </header>
        <div id="song-list" class="song-list">
        </div>
    </main>

    <footer class="player">
        <div class="now-playing">
            <p id="current-title">Testicek</p>
            <span id="current-artist">Tester</span>
        </div>
        <div class="controls">
            <button id="prev" class="player-btn">
                <span class="material-symbols-rounded">skip_previous</span>
            </button>

            <button id="play-pause" class="player-btn play-main">
                <span class="material-symbols-rounded" id="play-icon">play_arrow</span>
            </button>

            <button id="next" class="player-btn">
                <span class="material-symbols-rounded">skip_next</span>
            </button>
        </div>
        <audio id="audio-player" src=""></audio>
    </footer>
</div>
<script type="module" src="../script.js"></script>
</body>
</html>
